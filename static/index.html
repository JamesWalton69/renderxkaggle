<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Kaggle Cloud Manager</title>
  <link rel="stylesheet" href="/css/app.css?v=1.2.0">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div id="login-view" class="login-wrap hidden">
    <div class="login-card">
      <div class="brand brand-lg">
        <span class="brand-mark">KC</span>
        <span class="brand-name">Kaggle <em>Cloud</em> Manager</span>
      </div>
      <p class="login-sub">Remote notebook execution · one identity · drive it via MCP</p>
      <form id="login-form" autocomplete="off">
        <label for="password">Admin password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        <div id="login-error" class="form-error"></div>
      </form>
      <p class="login-hint">Password is set via <code>ADMIN_PASSWORD</code> env or generated on first boot.</p>
    </div>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="app-shell" class="shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">KC</span>
        <span class="brand-name">Kaggle <em>Cloud</em> Manager</span>
      </div>

      <nav class="nav" id="nav">
        <a href="#/overview" class="nav-item" data-view="overview">Overview</a>
        <a href="#/notebooks" class="nav-item" data-view="notebooks">Notebooks</a>
        <a href="#/jobs" class="nav-item" data-view="jobs">Jobs</a>
        <a href="#/settings" class="nav-item" data-view="settings">Settings</a>
      </nav>

      <div class="sidebar-foot">
        <div class="engine-dot" id="engine-dot" title="engine state"></div>
        <span class="engine-label" id="engine-label">starting…</span>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Sign out</button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="btn btn-ghost icon-btn menu-btn" id="menu-btn" type="button" aria-label="Menu">☰</button>
        <h1 class="page-title" id="page-title">Overview</h1>
        <div class="topbar-right">
          <button class="btn btn-primary btn-sm" id="quick-run" type="button">Run notebook</button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/js/api.js?v=1.2.0"></script>
  <script src="/js/ui.js?v=1.2.0"></script>
  <script src="/js/views/overview.js?v=1.2.0"></script>
  <script src="/js/views/notebooks.js?v=1.2.0"></script>
  <script src="/js/views/jobs.js?v=1.2.0"></script>
  <script src="/js/views/settings.js?v=1.2.0"></script>
  <script src="/js/app.js?v=1.2.0"></script>
</body>
</html>
