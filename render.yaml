# Render Blueprint — free tier friendly (single web service, no external infra).
services:
  - type: web
    name: kaggle-cloud-manager
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false        # Neon Postgres connection string — durable storage (Render free tier has no persistent disk)
      - key: ADMIN_PASSWORD
        sync: false        # set this in Render dashboard; if unset a random one is generated
      - key: KAGGLE_ACCOUNTS
        sync: false        # JSON list: [{"name","username","key"},...] — the only way to configure Kaggle accounts
      - key: KAGGLE_USERNAME
        sync: false        # optional legacy fallbacks (single account) when KAGGLE_ACCOUNTS is unset
      - key: KAGGLE_KEY
        sync: false
      - key: POLL_SECONDS
        value: "6"
